<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 50 510 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6e72"/>
      <stop offset="1" stop-color="#3f7f86"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4f57"/>
      <stop offset="1" stop-color="#2f6a70"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8c46e"/>
      <stop offset="1" stop-color="#5f9a8a"/>
    </linearGradient>
    <linearGradient id="gLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb39a"/>
      <stop offset="1" stop-color="#3f8089"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f78a0"/>
      <stop offset="1" stop-color="#6a6aa0"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6f98"/>
      <stop offset="1" stop-color="#7a5f94"/>
    </linearGradient>
    <linearGradient id="gBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6a70"/>
      <stop offset="1" stop-color="#6c5a8c"/>
    </linearGradient>
  </defs>

  <!-- Cristal -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Facetas -->
    <polygon points="315,130 450,250 400,360 280,300" fill="url(#gTeal)"/>
    <polygon points="315,130 280,300 185,245" fill="url(#gDark)"/>
    <polygon points="185,245 280,300 180,400" fill="url(#gLight)"/>
    <polygon points="185,245 180,400 85,420" fill="url(#gGreen)"/>
    <polygon points="85,420 180,400 250,480 140,575" fill="url(#gGreen)" opacity="0.92"/>
    <polygon points="140,575 250,480 250,725" fill="url(#gTeal)"/>
    <polygon points="280,300 400,360 250,480 180,400" fill="url(#gLight)" opacity="0.95"/>
    <polygon points="450,250 500,390 400,360" fill="url(#gBlue)"/>
    <polygon points="400,360 500,390 410,640 380,560" fill="url(#gPurple)"/>
    <polygon points="400,360 380,560 250,480" fill="url(#gDark)"/>
    <polygon points="250,480 380,560 410,640 250,725" fill="url(#gBase)"/>
  </g>

  <!-- Contorno exterior -->
  <polygon points="315,130 450,250 500,390 410,640 250,725 140,575 85,420 185,245"
           fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- Estrella de cuatro puntas -->
  <path d="M515,65 Q521,104 560,110 Q521,116 515,155 Q509,116 470,110 Q509,104 515,65 Z" fill="#1f2a30"/>
</svg>
